version: 2

models:
  - name: order_items
    description: |
      Items contained in each order. The grain of the table is one row per order item.

    semantic_model:
      enabled: true
    
    agg_time_dimension: ordered_at

    columns:
      # Entities
      - name: order_item_id
        data_tests:
          - not_null
          - unique
        entity:
          type: primary
          name: order_item

      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
        entity:
          type: foreign
          name: order

      - name: product_id
        entity:
          type: foreign
          name: product

      # Time dimension
      - name: ordered_at
        granularity: day
        dimension:
          type: time

      # Categorical dimensions
      - name: is_food_item
        dimension:
          type: categorical

      - name: is_drink_item
        dimension:
          type: categorical

    metrics:
      # Simple metrics
      - name: revenue
        description: Sum of the product revenue for each order item. Excludes tax.
        type: simple
        label: Revenue
        agg: sum
        expr: product_price

      - name: median_revenue
        description: The median revenue for each order item. Excludes tax.
        type: simple
        label: Median Revenue
        agg: median
        expr: product_price

      - name: food_revenue
        description: The revenue from food in each order
        label: Food Revenue
        type: simple
        agg: sum
        expr: "case when is_food_item then product_price else 0 end"

      - name: drink_revenue
        description: The revenue from drinks in each order
        label: Drink Revenue
        type: simple
        agg: sum
        expr: "case when is_drink_item then product_price else 0 end"

      # Ratio metrics
      - name: food_revenue_pct
        description: The % of order revenue from food.
        label: Food Revenue %
        type: ratio
        numerator: food_revenue
        denominator: revenue

      - name: drink_revenue_pct
        description: The % of order revenue from drinks.
        label: Drink Revenue %
        type: ratio
        numerator: drink_revenue
        denominator: revenue

      # Derived metric
      - name: revenue_growth_mom
        description: "Percentage growth of revenue compared to 1 month ago. Excluded tax"
        type: derived
        label: Revenue Growth % M/M
        expr: "(current_revenue - revenue_prev_month)*100/revenue_prev_month"
        input_metrics:
          - name: revenue
            alias: current_revenue
          - name: revenue
            offset_window: 1 month
            alias: revenue_prev_month

      # Helper + cumulative metrics
      - name: revenue_1
        description: The revenue generated for each order item. Revenue is calculated as a sum of revenue associated with each product in an order.
        type: simple
        agg: sum
        expr: product_price
        hidden: true

      - name: cumulative_revenue
        description: The cumulative revenue for all orders.
        label: Cumulative Revenue (All Time)
        type: cumulative
        input_metric: revenue_1