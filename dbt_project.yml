config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.5.0"

dbt-cloud:
  project-id: 531859 # Put your project id here

profile: bq-jaffle-shop-kyle-demo # Put your profile here

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  "dbt_date:time_zone": "America/Los_Angeles"

seeds:
  jaffle_shop:
    +schema: raw
  jaffle-data:
    +enabled: "{{ var('load_source_data', false) }}"

models:
  jaffle_shop:
    +static_analysis: strict
    staging:
      +materialized: view
    marts:
      +materialized: table

snapshots:
  jaffle_shop:
    +static_analysis: strict

analyses:
  jaffle_shop:
    +static_analysis: strict

tests:
  jaffle_shop:
    +static_analysis: strict

unit_tests:
  jaffle_shop:
    +static_analysis: strict

sources:
  jaffle_shop:
    +static_analysis: strict

flags:
  require_generic_test_arguments_property: true